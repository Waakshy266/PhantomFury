<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Phantom Fury - Register</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center;">
    <div style="width: 100%; max-width: 360px; padding: 25px; background: var(--card-black); border: 2px solid var(--neon-red); box-shadow: var(--neon-glow); border-radius: 8px; margin: 20px;">
        <h2 style="text-align: center; margin-bottom: 5px;">CREATE IDENTITY</h2>
        <p style="text-align: center; color: var(--text-gray); font-size: 13px; margin-bottom: 25px;">Register your guild credentials</p>
        <div id="errMsg" style="color: var(--neon-red); font-size: 13px; margin-bottom: 15px; display: none; text-align: center; font-weight: bold;"></div>
        <form id="rForm">
            <input type="text" id="uName" placeholder="Username" required autocomplete="off">
            <input type="password" id="pWord" placeholder="Password" required>
            <button type="submit" class="primary-btn">JOIN FORCES</button>
        </form>
        <a href="/login" style="display: block; text-align: center; color: var(--text-gray); font-size: 13px; margin-top: 20px; text-decoration: none;">Already registered? Login here</a>
    </div>
    <script>
        document.getElementById('rForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('uName').value;
            const password = document.getElementById('pWord').value;
            const err = document.getElementById('errMsg');
            
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = data.redirect;
            } else {
                err.textContent = data.error;
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
